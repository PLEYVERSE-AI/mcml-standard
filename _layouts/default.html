<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <style>
      .mcml-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px;
                  padding: 14px 0; margin-bottom: 24px; border-bottom: 1px solid #d0d7de; font-size: 15px; }
      .mcml-nav .brand { font-weight: 600; color: #1f2328; margin-right: 12px; }
      .mcml-nav a { color: #0969da; text-decoration: none; }
      .mcml-nav a:hover { text-decoration: underline; }
      .mcml-nav a.active { color: #1f2328; font-weight: 600; border-bottom: 2px solid #0969da; padding-bottom: 2px; }
      .mcml-nav .spacer { flex: 1; }
    </style>
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-4 markdown-body">
      {% assign u = page.url %}
      <nav class="mcml-nav" aria-label="Site">
        <a class="brand" href="{{ "/" | relative_url }}">MCML</a>
        <a href="{{ "/" | relative_url }}" {% if u == "/" or u == "/index.html" %}class="active"{% endif %}>Standard</a>
        <a href="{{ "/docs/runtime-safety.html" | relative_url }}" {% if u contains "runtime-safety" %}class="active"{% endif %}>Runtime Safety</a>
        <a href="{{ "/gateway/" | relative_url }}" {% if u == "/gateway/" %}class="active"{% endif %}>Gateway MVP</a>
        <a href="{{ "/gateway/RESULTS.html" | relative_url }}" {% if u contains "RESULTS" %}class="active"{% endif %}>Results</a>
        <a href="{{ "/docs/use-cases.html" | relative_url }}" {% if u contains "use-cases" %}class="active"{% endif %}>Use Cases</a>
        <span class="spacer"></span>
        <a href="https://github.com/PLEYVERSE-AI/mcml-standard">GitHub</a>
      </nav>

      {{ content }}

      {% if site.github.private != true and site.github.license %}
      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
